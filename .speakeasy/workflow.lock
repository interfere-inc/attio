                - cleanup: true
                - format: true
            output: .speakeasy/outputs/attio.openapi.yaml
            registry:
                location: registry.speakeasyapi.dev/interfere/api/attio-api
    targets:
        attio:
            target: typescript
            source: Attio API
            publish:
                npm:
                    token: $npm_token
            codeSamples:
                registry:
                    location: registry.speakeasyapi.dev/interfere/api/attio-api-typescript-code-samples
                labelOverride:
                    fixedValue: Typescript (SDK)
                blocking: false
