releaseNotes: "## Typescript SDK Changes:\n* `attio.tasks.create()`: \n  *  `request.data.linkedRecords` **Changed** (Breaking ⚠️)\n  *  `response.data.completedAt` **Added**\n* `attio.tasks.update()`: \n  *  `request.body.data.linkedRecords` **Changed** (Breaking ⚠️)\n  *  `response.data.completedAt` **Added**\n* `attio.scimUsers.get/scim/v2/users/{userId}()`: **Added**\n* `attio.scimUsers.delete/scim/v2/users/{userId}()`: **Added**\n* `attio.scimGroups.get/scim/v2/groups/{workspaceTeamId}()`: **Added**\n* `attio.scimGroups.delete/scim/v2/groups/{workspaceTeamId}()`: **Added**\n* `attio.tasks.list()`: \n  *  `request.sort` **Changed**\n  *  `response.data[].completedAt` **Added**\n* `attio.tasks.get()`:  `response.data.completedAt` **Added**\n"
