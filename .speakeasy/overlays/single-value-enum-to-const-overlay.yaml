overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Single-value enum to const
  version: 0.0.1
  description: |
    Converts inline single-value enums (e.g. `enum: ["text"]`) to OpenAPI 3.1
    `const` values. Attio's spec uses single-value enums extensively as
    discriminator fields on `output-value` / `input-value` anyOf variants and
    error response codes. Speakeasy hoists each unique single-value enum into
    its own top-level type alias model (e.g. `AttributeTypeText = "text"`),
    producing ~30 noisy single-line types in `docs/models/` and forcing
    consumers to import a discrete type for every variant tag.

    With `const` instead, Speakeasy inlines the literal value directly into
    the parent object's TypeScript type, eliminating these standalone models.

    Each action below targets all schemas that have `enum: [<value>]` and
    adds a matching `const`. A final action strips the now-redundant `enum`
    arrays.
actions:

  #  88 occurrences (type: 'string', value: 'invalid_request_error')
  - target: $..[?(@.enum && length(@.enum) == 1 && @.enum[0] == "invalid_request_error" && @.type == "string")]
    update:
      const: invalid_request_error

  #  53 occurrences (type: 'string', value: 'not_found')
  - target: $..[?(@.enum && length(@.enum) == 1 && @.enum[0] == "not_found" && @.type == "string")]
    update:
      const: not_found

  #  53 occurrences (type: 'integer', value: 404)
