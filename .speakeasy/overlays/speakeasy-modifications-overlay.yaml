overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: Speakeasy Modifications
  version: 0.0.7
  description: |
    Assigns operationIds and SDK method names for the Attio API.

    Attio's upstream spec (https://api.attio.com/openapi/api) does not define
    `operationId` on any of its 87 operations, which forces Speakeasy to fall
    back to autogenerated names like `sdk.Files.post_/v2/files/upload()`.
    This overlay sets a stable operationId on every operation and uses
    `x-speakeasy-name-override` to produce idiomatic short method names
    (e.g. `sdk.files.upload()`). `x-speakeasy-group` is used where the Attio
    tag does not match the desired SDK namespace (e.g. `SCIM users` ->
    `scimUsers`, attribute options nested under `attributes.options`).

    If Attio adds operationIds upstream, most of this overlay can be deleted;
    only the group/namespace overrides would remain.
actions:

  # ===== attributes =====
  - target: $["paths"]["/v2/{target}/{identifier}/attributes"]["get"]
    update:
      operationId: listAllAttributes
      x-speakeasy-name-override: listAll
  - target: $["paths"]["/v2/{target}/{identifier}/attributes"]["post"]
    update:
      operationId: createNewAttribute
      x-speakeasy-name-override: createNew
  - target: $["paths"]["/v2/{target}/{identifier}/attributes/{attribute}"]["get"]
    update:
      operationId: getAttribute
      x-speakeasy-name-override: get
  - target: $["paths"]["/v2/{target}/{identifier}/attributes/{attribute}"]["patch"]
    update:
      operationId: updateAttribute
      x-speakeasy-name-override: update
  - target: $["paths"]["/v2/{target}/{identifier}/attributes/{attribute}/options/{option}"]["patch"]
